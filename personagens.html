<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personagens - LuminusLore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-secao="personagens">
  <header class="topo" id="topo"></header>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h1 id="titulo-secao"></h1>
        <p class="descricao-secao" id="descricao-secao"></p>
      </div>
      <a class="botao primario" id="btn-novo" href="#">+ Novo</a>
    </div>
    <div class="ferramentas">
      <input type="search" id="busca" placeholder="Buscar nos textos…" aria-label="Buscar">
      <select id="ordem" aria-label="Ordem">
        <option value="titulo">A–Z</option>
        <option value="recentes">Editados por último</option>
      </select>
    </div>
    <div class="filtros" id="filtros"></div>
    <div id="lista" class="grade"><p class="vazio">Carregando…</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/secoes.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script src="js/secao.js"></script>
</body>
</html>
