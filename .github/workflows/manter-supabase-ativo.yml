# O plano grátis do Supabase pausa o projeto depois de 1 semana sem uso.
# Isto chama o banco a cada 3 dias para ele continuar ativo.
# Usa a URL e a chave pública que já estão em js/config.js.

name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chamar o banco
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" js/config.js)
          CHAVE=$(grep -oP "supabaseAnonKey:\s*'\K[^']+" js/config.js)
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" -H "Content-Type: application/json" -d '{}'
