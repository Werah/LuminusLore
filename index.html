<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminusLore - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="tela-login">
    <div class="caixa-login">
      <div class="selo-login">✦</div>
      <h1>LuminusLore</h1>
      <p>Os textos do cenário. Entre para ler e escrever.</p>

      <div class="abas abas-login" role="tablist">
        <button type="button" class="ativo" data-aba="form-login" role="tab">Entrar</button>
        <button type="button" data-aba="form-senha" role="tab">Trocar senha</button>
      </div>

      <!-- onsubmit="return false": se enviar antes do JavaScript carregar, não faz nada
           (o envio padrão do navegador poria a senha no endereço da página) -->
      <form id="form-login" method="post" onsubmit="return false">
        <label>E-mail
          <input type="email" name="email" autocomplete="username" required autofocus>
        </label>
        <label>Senha
          <input type="password" name="senha" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primario">Entrar</button>
        <p class="erro"></p>
      </form>

      <!-- Para quem recebeu uma senha provisória: entra com ela e já define a própria -->
      <form id="form-senha" method="post" onsubmit="return false" hidden>
        <label>E-mail
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>Senha atual
          <input type="password" name="atual" autocomplete="current-password" required>
        </label>
        <label>Nova senha
          <input type="password" name="nova" minlength="6" autocomplete="new-password" required>
        </label>
        <label>Repita a nova senha
          <input type="password" name="repetida" minlength="6" autocomplete="new-password" required>
        </label>
        <button type="submit" class="primario">Trocar senha e entrar</button>
        <p class="erro"></p>
      </form>

      <p class="rodape-login">Ainda não tem conta? Peça para quem cuida do site.<br>
        Recebeu uma senha provisória? Use <strong>Trocar senha</strong>.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/secoes.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Já logado? Vai direto pra home
    sessaoPronta.then(sessao => {
      if (sessao) window.location.href = 'home.html';
    });

    const formLogin = document.getElementById('form-login');
    const formSenha = document.getElementById('form-senha');
    const abas = document.querySelectorAll('.abas-login button');

    // Troca de aba levando junto o e-mail já digitado
    abas.forEach(aba => aba.addEventListener('click', () => {
      const de = formLogin.hidden ? formSenha : formLogin;
      const para = document.getElementById(aba.dataset.aba);
      if (para.email.value === '') para.email.value = de.email.value;
      abas.forEach(b => b.classList.toggle('ativo', b === aba));
      formLogin.hidden = para !== formLogin;
      formSenha.hidden = para !== formSenha;
      (para.email.value ? para.querySelector('input[type="password"]') : para.email).focus();
    }));

    formLogin.addEventListener('submit', (e) => {
      e.preventDefault();
      const erro = formLogin.querySelector('.erro');
      erro.textContent = '';
      semCliqueDuplo(formLogin, async () => {
        try {
          await entrar(formLogin.email.value, formLogin.senha.value);
          window.location.href = 'home.html';
        } catch (err) {
          erro.textContent = err.message || 'Não foi possível entrar';
        }
      });
    });

    // Confere a senha atual entrando com ela e, logado, troca pela nova
    formSenha.addEventListener('submit', (e) => {
      e.preventDefault();
      const erro = formSenha.querySelector('.erro');
      erro.textContent = '';
      if (formSenha.nova.value !== formSenha.repetida.value) {
        erro.textContent = 'As duas senhas novas não são iguais';
        return;
      }
      if (formSenha.nova.value === formSenha.atual.value) {
        erro.textContent = 'A nova senha precisa ser diferente da atual';
        return;
      }
      semCliqueDuplo(formSenha, async () => {
        try {
          await entrar(formSenha.email.value, formSenha.atual.value);
        } catch (err) {
          erro.textContent = err.message || 'Não foi possível entrar';
          return;
        }
        try {
          await trocarSenha(formSenha.nova.value);
          window.location.href = 'home.html';
        } catch (err) {
          // Não trocou: sai de novo, para a pessoa não ficar logada sem querer
          await sb.auth.signOut();
          erro.textContent = err.message;
        }
      });
    });
  </script>
</body>
</html>
