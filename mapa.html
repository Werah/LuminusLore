<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo - LuminusLore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-mapa">
  <header class="topo" id="topo"></header>

  <main class="tela-mapa" id="tela-mapa">
    <section class="lado-mapa">
      <div id="mapa"></div>
      <!-- Ficha do país (globo nas pastas da lista do Mundo): abre por cima do mapa -->
      <div class="sobre-mapa" id="sobre-mapa" hidden></div>
      <div class="controles-mapa">
        <div class="estilo-ponto" id="estilo-ponto" hidden></div>
        <div class="barra-mapa" id="barra-mapa"></div>
      </div>
    </section>
    <!-- Arrastar muda o tamanho de cada lado; as setas escondem um lado inteiro -->
    <div class="divisor" id="divisor" role="separator" tabindex="0"
         aria-label="Arraste para mudar o tamanho do mapa e do texto">
      <button type="button" data-passo="-1" title="Diminuir o mapa"><span>‹</span></button>
      <span class="pegador" aria-hidden="true"></span>
      <button type="button" data-passo="1" title="Diminuir o texto"><span>›</span></button>
    </div>
    <!-- As páginas de texto (lista do Mundo, pontos de interesse, editor) abrem aqui dentro -->
    <!-- name="painel": os links da ficha do país abrem aqui -->
    <iframe class="lado-texto" id="painel" name="painel" title="Texto"></iframe>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/secoes.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
