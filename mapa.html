<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo - LuminusLore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-mapa">
  <header class="topo" id="topo"></header>

  <main class="tela-mapa">
    <section class="lado-mapa">
      <div id="mapa"></div>
      <div class="controles-mapa">
        <div class="estilo-ponto" id="estilo-ponto" hidden></div>
        <div class="barra-mapa" id="barra-mapa"></div>
      </div>
    </section>
    <!-- As páginas de texto (lista do Mundo, verbetes, editor) abrem aqui dentro -->
    <iframe class="lado-texto" id="painel" title="Texto"></iframe>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/secoes.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
