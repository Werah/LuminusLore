<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminusLore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-home">
  <header class="topo" id="topo"></header>

  <main class="divisorias fatias" id="divisorias"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/secoes.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/api.js"></script>
  <script>
    exigirLogin();
    montarTopo('');

    // Uma fatia por seção, saindo do centro da tela, todas com a mesma área.
    // Ordem das fatias no sentido horário, começando em cima à esquerda (seções novas entram no fim)
    const ORDEM = ['mundo', 'personagens', 'organizacoes', 'panteao', 'historia'];
    const chaves = [...ORDEM.filter(k => SECOES[k]), ...Object.keys(SECOES).filter(k => !ORDEM.includes(k))];

    // A borda da tela é percorrida de 0 a 4 (um lado por unidade, no sentido horário a partir do
    // canto de cima à esquerda). Do centro, cada lado "vale" exatamente 1/4 da área da tela,
    // seja ela larga ou estreita; então fatias com o mesmo trecho dessa volta têm a mesma área.
    function pontoNaBorda(t) {
      const u = ((t % 4) + 4) % 4;
      const lado = Math.floor(u);
      const f = (u - lado) * 100;
      return [[f, 0], [100, f], [100 - f, 100], [0, 100 - f]][lado];
    }
    const INICIO = -0.3;                 // onde começa a primeira fatia (deixa uma fatia bem embaixo)
    const TRECHO = 4 / chaves.length;
    const ATE_O_TEXTO = 0.55;            // o nome fica a 55% do caminho entre o centro e a borda
    const pct = ([x, y]) => `${x.toFixed(2)}% ${y.toFixed(2)}%`;

    const fatias = chaves.map((chave, i) => {
      const s = SECOES[chave];
      const t0 = INICIO + i * TRECHO;
      const t1 = t0 + TRECHO;
      const pontos = [pontoNaBorda(t0)];
      for (let canto = Math.floor(t0) + 1; canto < t1; canto++) pontos.push(pontoNaBorda(canto));
      pontos.push(pontoNaBorda(t1));
      const meio = pontoNaBorda(t0 + TRECHO / 2);
      const forma = `polygon(50% 50%, ${pontos.map(pct).join(', ')})`;
      // Onde fica o nome (e de onde a fatia cresce no hover)
      const lx = `${(50 + (meio[0] - 50) * ATE_O_TEXTO).toFixed(2)}%`;
      const ly = `${(50 + (meio[1] - 50) * ATE_O_TEXTO).toFixed(2)}%`;
      return `
        <div class="fatia" style="--cor: ${s.cor}; --forma: ${forma}; --lx: ${lx}; --ly: ${ly}">
          <a class="divisoria" href="${paginaDaSecao(s)}" data-icone="${s.icone}" style="--cor: ${s.cor}">
            <span class="fatia-conteudo">
              <span class="icone">${s.icone}</span>
              <span class="titulo">${esc(s.nome)}</span>
              <small>${esc(s.descricao)}</small>
            </span>
          </a>
        </div>`;
    });

    document.getElementById('divisorias').innerHTML = fatias.join('');
  </script>
</body>
</html>
